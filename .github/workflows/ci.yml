name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verification/verify_preserved_archives.py --git-index
      - run: python3 scripts/verification/repository_inventory.py --check
      - run: python3 scripts/github/publish_issues.py
      - run: python3 scripts/github/build_backlog.py --check
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv python install
      - run: uv sync --project services/api --frozen
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:api
      - run: npm run test:auth
      - run: npm run test:judge
      - run: npm run test:tooling
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
